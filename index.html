/* ── Supabase Client ── */
const SURL = "https://kfjqttdsdahllgzfmbyj.supabase.co";
const SKEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmanF0dGRzZGFobGxnemZtYnlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NTE3NzUsImV4cCI6MjA5NTIyNzc3NX0.0P-diNmiKRFRDglIuHrMOpHszuDmWlA6kp30K8jYQVY";

async function sbFetch(path, opts={}){
  const res = await fetch(SURL+path, {
    ...opts,
    headers: {
      "apikey": SKEY,
      "Authorization": "Bearer "+(lsGet("sb_token")||SKEY),
      "Content-Type": "application/json",
      "Prefer": "return=representation",
      ...(opts.headers||{})
    }
  });
  if(!res.ok){ const e=await res.text(); console.error("SB Error:",e); return null; }
  const ct=res.headers.get("content-type")||"";
  if(ct.includes("json")) return res.json();
  return null;
}

// Auth helpers
async function sbSignInGoogle(){
  window.location.href = SURL+"/auth/v1/authorize?provider=google&redirect_to="+encodeURIComponent(window.location.href);
}
async function sbGetSession(){
  const token = lsGet("sb_token");
  if(!token) return null;
  const data = await sbFetch("/auth/v1/user");
  return data;
}
async function sbSignOut(){
  await sbFetch("/auth/v1/logout", {method:"POST"});
  lsSet("sb_token","");
  lsSet("sb_user","");
}

// Handle OAuth callback
function handleAuthCallback(){
  const hash = window.location.hash;
  if(hash && hash.includes("access_token")){
    const params = new URLSearchParams(hash.substring(1));
    const token = params.get("access_token");
    if(token){
      lsSet("sb_token", token);
      window.location.hash = "";
    }
  }
}

// DB helpers
async function sbSelect(table, query=""){
  return await sbFetch("/rest/v1/"+table+"?"+query, {method:"GET"}) || [];
}
async function sbInsert(table, data){
  return await sbFetch("/rest/v1/"+table, {method:"POST", body:JSON.stringify(data)});
}
async function sbUpdate(table, data, match){
  return await sbFetch("/rest/v1/"+table+"?"+match, {method:"PATCH", body:JSON.stringify(data)});
}
async function sbDelete(table, match){
  return await sbFetch("/rest/v1/"+table+"?"+match, {method:"DELETE"});
}
async function sbUpsert(table, data){
  return await sbFetch("/rest/v1/"+table, {
    method:"POST",
    headers:{"Prefer":"resolution=merge-duplicates,return=representation"},
    body:JSON.stringify(data)
  });
}

// File upload
async function sbUpload(bucket, path, base64data){
  const base64 = base64data.split(",")[1] || base64data;
  const mime = (base64data.match(/data:([^;]+);/)||[])[1] || "image/jpeg";
  const bytes = atob(base64);
  const arr = new Uint8Array(bytes.length);
  for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
  const blob = new Blob([arr], {type:mime});
  const res = await fetch(SURL+"/storage/v1/object/"+bucket+"/"+path, {
    method:"POST",
    headers:{"apikey":SKEY,"Authorization":"Bearer "+(lsGet("sb_token")||SKEY),"Content-Type":mime,"x-upsert":"true"},
    body:blob
  });
  if(!res.ok) return null;
  return SURL+"/storage/v1/object/public/"+bucket+"/"+path;
}

// Realtime
function sbRealtime(table, tripId, onChange){
  const wsUrl = SURL.replace("https://","wss://").replace("http://","ws://")+"/realtime/v1/websocket?apikey="+SKEY+"&vsn=1.0.0";
  const ws = new WebSocket(wsUrl);
  const channel = "realtime:public:"+table+":trip_id=eq."+tripId;
  ws.onopen = ()=>{
    ws.send(JSON.stringify({topic:channel, event:"phx_join", payload:{}, ref:"1"}));
  };
  ws.onmessage = (e)=>{
    const msg = JSON.parse(e.data);
    if(msg.event==="INSERT"||msg.event==="UPDATE"||msg.event==="DELETE") onChange(msg);
  };
  ws.onerror = (e)=>console.log("WS error:",e);
  return ws;
}

    bg:"#000", surface:"#111", surface2:"#1a1a1a",
    border:"rgba(255,255,255,0.10)", border2:"rgba(255,255,255,0.18)",
    text:"#fff", textSub:"rgba(255,255,255,0.50)", textMuted:"rgba(255,255,255,0.28)",
    accent:"#FFDD57", accentText:"#FFDD57", accentDark:"#c9a800",
    danger:"#ff6b6b",
    fontHead:"'Montserrat',sans-serif", fontBody:"'DM Sans',sans-serif",
    isDark:true,
  } : {
    bg:"#f5f5f0", surface:"#ffffff", surface2:"#eeede8",
    border:"rgba(0,0,0,0.09)", border2:"rgba(0,0,0,0.15)",
    text:"#111111", textSub:"rgba(0,0,0,0.50)", textMuted:"rgba(0,0,0,0.28)",
    accent:"#FFDD57", accentText:"#9a7500", accentDark:"#7a5c00",
    danger:"#e53e3e",
    fontHead:"'Montserrat',sans-serif", fontBody:"'DM Sans',sans-serif",
    isDark:false,
  };
}

}

/* ── Custom Category Dropdown ── */
function CatSelect({value,onChange,options,icons,style={}}){
  const T=useT();
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    const handler=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown",handler);
    return()=>document.removeEventListener("mousedown",handler);
  },[]);
  const icon=icons[value];
  return(
    <div ref={ref} style={{position:"relative",...style}}>
      <div onClick={()=>setOpen(v=>!v)} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:"rgba(255,255,255,0.07)",border:`1px solid ${open?T.accent:T.border}`,borderRadius:10,cursor:"pointer",userSelect:"none"}}>
        {icon&&<span style={{display:"flex",alignItems:"center",color:T.accent,flexShrink:0}}>{icon}</span>}
        <span style={{flex:1,fontSize:14,color:T.text,fontWeight:500}}>{value.replace(/^[\p{Emoji}\s]+/u,"").trim()}</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" style={{transform:open?"rotate(180deg)":"none",transition:"transform 0.2s",flexShrink:0}}><path d="M6 9l6 6 6-6" stroke={T.textSub} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </div>
      {open&&<div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:T.surface,border:`1px solid ${T.border2}`,borderRadius:12,zIndex:500,overflowY:"auto",maxHeight:280,boxShadow:"0 8px 24px rgba(0,0,0,0.35)"}}>
        {options.map(opt=>{
          const ic=icons[opt];
          const isSelected=opt===value;
          return(
            <div key={opt} onClick={()=>{onChange(opt);setOpen(false);}} style={{display:"flex",alignItems:"center",gap:10,padding:"11px 14px",background:isSelected?"rgba(255,221,87,0.1)":"transparent",cursor:"pointer",borderBottom:`1px solid ${T.border}`}}>
              {ic&&<span style={{display:"flex",alignItems:"center",color:isSelected?T.accent:T.textSub,flexShrink:0}}>{ic}</span>}
              <span style={{fontSize:14,fontWeight:isSelected?700:400,color:isSelected?T.accent:T.text}}>{opt.replace(/^[\p{Emoji}\s]+/u,"").trim()}</span>
              {isSelected&&<svg width="14" height="14" viewBox="0 0 24 24" fill="none" style={{marginLeft:"auto"}}><path d="M20 6L9 17l-5-5" stroke={T.accent} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
            </div>
          );
        })}
      </div>}
    </div>
  );
}

/* ── Splash ── */
function Splash({onDone}){
  const T=useT();
  const [vis,setVis]=useState(false);
  useEffect(()=>{ const a=setTimeout(()=>setVis(true),150); const b=setTimeout(()=>onDone(),2400); return()=>{clearTimeout(a);clearTimeout(b);}; },[]);
  return(

function SignIn({onDone}){
  const T=useT();
  const [step,setStep]=useState("main");
  const [phone,setPhone]=useState("");
  const [otp,setOtp]=useState(["","","","","",""]);
  const [fOtp]=useState(()=>String(100000+Math.floor(Math.random()*900000)));
  const [sending,setSending]=useState(false);
  const refs=useRef([]);
  const inp={padding:"13px 14px",background:"rgba(255,255,255,0.07)",border:`1px solid ${T.border}`,borderRadius:12,color:T.text,fontSize:15,outline:"none",fontFamily:T.fontBody,width:"100%",boxSizing:"border-box"};
  const sendOtp=()=>{ if(phone.length<10)return; setSending(true); setTimeout(()=>{setSending(false);setStep("otp");},1000); };
  const onOC=(i,v)=>{ if(!/^\d*$/.test(v))return; const n=[...otp]; n[i]=v.slice(-1); setOtp(n); if(v&&i<5)refs.current[i+1]?.focus(); };
  const onOK=(i,e)=>{ if(e.key==="Backspace"&&!otp[i]&&i>0)refs.current[i-1]?.focus(); };
  const verify=()=>{ if(otp.join("").length<6)return; setTimeout(()=>onDone({phone}),500); };

/* ── Create Trip ── */
function CreateTrip({user,onDone,onBack}){
  const T=useT();
  const [step,setStep]=useState(1);
  const [tn,setTn]=useState(""); const [dest,setDest]=useState(""); const [sd,setSd]=useState(""); const [ed,setEd]=useState(""); const [cov,setCov]=useState(COVERS[0].id); const [coverPhoto,setCoverPhoto]=useState(null); const [coverLoaded,setCoverLoaded]=useState(false); const [curr,setCurr]=useState("INR");
  const coverRef=useRef(null);
  const [friends,setFriends]=useState([user.name]); const [nf,setNf]=useState(""); const [fe,setFe]=useState("");
  const today=new Date().toISOString().split("T")[0];
  const inp={padding:"13px 14px",background:"rgba(255,255,255,0.07)",border:`1px solid ${T.border}`,borderRadius:12,color:T.text,fontSize:15,outline:"none",fontFamily:T.fontBody,width:"100%",boxSizing:"border-box"};
  const addF=()=>{ const n=nf.trim(); if(!n)return; if(friends.includes(n)){setFe("Already added");return;} if(friends.length>=10){setFe("Max 10");return;} setFriends(p=>[...p,n]); setNf(""); setFe(""); };
  const create=async()=>{
    const tripId=genId();
    const trip={id:tripId,tripName:tn.trim(),destination:dest.trim(),startDate:sd,endDate:ed,cover:cov,coverPhoto:null,currency:curr,friends,expenses:[],itinerary:[],vault:[],notes:[],memberPhotos:{[user.name]:user.photo||null},createdAt:Date.now()};
    // Upload cover photo if any
    if(coverPhoto && coverPhoto.startsWith("data:")){
      const url=await sbUpload("avatars","cover_"+tripId+".jpg",coverPhoto).catch(()=>null);
      if(url) trip.coverPhoto=url;
    } else if(coverPhoto){
      trip.coverPhoto=coverPhoto;
    }
    // Save to Supabase
    try{
      const sbU=await sbGetSession();
      if(sbU && sbU.id){
        await sbInsert("trips",{id:tripId,trip_name:trip.tripName,destination:trip.destination,start_date:sd,end_date:ed,cover:cov,cover_photo_url:trip.coverPhoto,currency:curr,created_by:sbU.id});
        // Add all friends as members
        for(const fname of friends){
          const photoUrl=fname===user.name?(user.photo&&!user.photo.startsWith("data:")?user.photo:null):null;
          await sbInsert("trip_members",{trip_id:tripId,user_id:fname===user.name?sbU.id:sbU.id,display_name:fname,photo_url:photoUrl}).catch(()=>{});
        }
      }
    }catch(e){ console.error("Trip create SB error:",e); }
    const all=[...loadTrips(),trip]; saveTrips(all); onDone(trip);
  };
  const onCoverFile=e=>{ const f=e.target.files[0]; e.target.value=""; if(!f)return; if(f.size>5*1024*1024){return;} const rd=new FileReader(); rd.onload=ev=>{ setCoverPhoto(ev.target.result); setCoverLoaded(false); }; rd.readAsDataURL(f); };
  if(step===1) return(
    <Scr><div style={{padding:"0 24px 100px"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,paddingTop:52,marginBottom:22}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:T.textSub,fontSize:20,cursor:"pointer",padding:0,lineHeight:1}}>←</button>
        <div><div style={{fontFamily:T.fontHead,fontSize:20,fontWeight:900,color:T.text,letterSpacing:-1}}>NEW TRIP</div><div style={{fontSize:13,color:T.textSub}}>Step 1 of 2</div></div>
      </div>
      <div style={{height:3,background:"rgba(255,255,255,0.08)",borderRadius:2,marginBottom:22}}><div style={{width:"50%",height:"100%",background:T.accent,borderRadius:2}}/></div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div><div style={{fontSize:12,fontWeight:600,color:T.textSub,marginBottom:6}}>TRIP NAME *</div><input style={inp} placeholder="e.g. Goa 2025" value={tn} onChange={e=>setTn(e.target.value)}/></div>

function VaultPdf({src,name}){
  const T=useT();
  const openPdf=()=>{
    try{
      const b64=src.split(",")[1];
      const bytes=atob(b64);
      const arr=new Uint8Array(bytes.length);
      for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
      const blob=new Blob([arr],{type:"application/pdf"});
      const url=URL.createObjectURL(blob);
      window.open(url,"_blank");
    }catch(e){ alert("Could not open PDF."); }
  };
  return(
    <div style={{width:"100%",borderRadius:14,overflow:"hidden",background:"#111",border:"1px solid rgba(255,255,255,0.1)"}}>
      <div style={{padding:"14px 16px",background:"rgba(255,255,255,0.05)",borderBottom:"1px solid rgba(255,255,255,0.1)",display:"flex",alignItems:"center",gap:10}}>

function simplifyDebts(bal){
  const cr=[],db=[];
  Object.entries(bal).forEach(([n,b])=>{ if(b>0.5)cr.push({n,a:b}); else if(b<-0.5)db.push({n,a:-b}); });
  cr.sort((a,b)=>b.a-a.a); db.sort((a,b)=>b.a-a.a);
  const t=[]; let i=0,j=0;
  while(i<cr.length&&j<db.length){ const a=Math.min(cr[i].a,db[j].a); t.push({from:db[j].n,to:cr[i].n,amount:a}); cr[i].a-=a; db[j].a-=a; if(cr[i].a<0.5)i++; if(db[j].a<0.5)j++; }
  return t;
}

}

/* ── Root ── */
function App(){
  const [scr,setScr]=useState("splash");
  const [user,setUser]=useState(null);
  const [trips,setTrips]=useState([]);
  const [cs,setCs]=useState(0);
  const [at,setAt]=useState(null);
  const [dark,setDark]=useState(()=>{ try{ return localStorage.getItem("ts_dark")!=="false"; }catch(e){ return true; } });
  const [sbUser,setSbUser]=useState(null);
  const [loading,setLoading]=useState(true);
  const theme=getT(dark);
  const toggleTheme=()=>{ const nd=!dark; setDark(nd); try{ localStorage.setItem("ts_dark",String(nd)); }catch(e){} };

  useEffect(()=>{
    // Inject fonts
    const link = document.createElement('link');
    link.rel='stylesheet';
    link.href='https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Barlow+Condensed:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap';
    document.head.appendChild(link);
    // Inject CSS
    const style = document.createElement('style');
    style.textContent = `
      *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
      body{background:#000;}
      input,select,textarea,button{font-family:'DM Sans',sans-serif;}
      input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
      ::placeholder{color:rgba(255,255,255,0.25);}
      ::-webkit-scrollbar{width:0;}
      @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      @keyframes scaleIn{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
      .fade-up{animation:fadeUp 0.55s cubic-bezier(.22,1,.36,1) both}
      .fade-in{animation:fadeIn 0.45s ease both}
      .scale-in{animation:scaleIn 0.4s cubic-bezier(.34,1.56,.64,1) both}
      .btn-press:active{transform:scale(0.97);transition:transform 0.1s;}
      .tag-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.7);font-size:13px;cursor:pointer;transition:all 0.18s;}
      .tag-chip.active{background:#fff;color:#000;border-color:#fff;font-weight:600;}
      .tag-chip .remove{font-size:14px;color:rgba(0,0,0,0.5);cursor:pointer;}
    `;
    document.head.appendChild(style);
    return ()=>{ try{document.head.removeChild(link);document.head.removeChild(style);}catch(e){} };
  }, []);

  useEffect(()=>{
    handleAuthCallback();
    // Check if user is logged in via Supabase
    sbGetSession().then(sbU=>{
      if(sbU && sbU.id){
        setSbUser(sbU);
        const localUser=loadUser();
        if(localUser?.name){
          setUser(localUser);
          loadTripsFromSB(sbU.id).then(t=>{ if(t&&t.length) setTrips(t); else setTrips(loadTrips()); });
        }
      } else {
        const u=loadUser(); if(u?.name)setUser(u); setTrips(loadTrips());
      }
      setLoading(false);
    }).catch(()=>{ const u=loadUser(); if(u?.name)setUser(u); setTrips(loadTrips()); setLoading(false); });
  },[]);

  const loadTripsFromSB=async(userId)=>{
    try{
      const members=await sbSelect("trip_members","user_id=eq."+userId+"&select=trip_id");
      if(!members||!members.length) return [];
      const ids=members.map(m=>m.trip_id).join(",");
      const tripsData=await sbSelect("trips","id=in.("+ids+")&select=*");
      if(!tripsData||!tripsData.length) return [];
      // Load full trip data for each trip
      const full=await Promise.all(tripsData.map(async t=>{
        const [exps,itin,vault,notes,acts,mems,trash]=await Promise.all([
          sbSelect("expenses","trip_id=eq."+t.id+"&order=created_at.asc"),
          sbSelect("itinerary","trip_id=eq."+t.id+"&order=created_at.asc"),
          sbSelect("vault","trip_id=eq."+t.id+"&order=created_at.asc"),
          sbSelect("notes","trip_id=eq."+t.id+"&order=created_at.desc"),
          sbSelect("activity_log","trip_id=eq."+t.id+"&order=created_at.desc&limit=50"),
          sbSelect("trip_members","trip_id=eq."+t.id),
          sbSelect("trash","trip_id=eq."+t.id),
        ]);
        const memberPhotos={};
        (mems||[]).forEach(m=>{ if(m.photo_url) memberPhotos[m.display_name]=m.photo_url; });
        return {
          id:t.id, tripName:t.trip_name, destination:t.destination,
          startDate:t.start_date, endDate:t.end_date, cover:t.cover,
          coverPhoto:t.cover_photo_url||null, currency:t.currency||"INR",
          friends:(mems||[]).map(m=>m.display_name),
          memberPhotos,
          expenses:(exps||[]).map(e=>({id:e.id,payer:e.payer,amount:Number(e.amount),desc:e.description,category:e.category,date:e.expense_date,splitAmong:e.split_among||[],receipt:e.receipt_url||null})),
          itinerary:(itin||[]).map(i=>({id:i.id,date:i.item_date,time:i.item_time,title:i.title,desc:i.description,category:i.category,addedBy:i.added_by})),
          vault:(vault||[]).map(v=>({id:v.id,name:v.name,category:v.category,content:v.content,file:v.file_url,fileName:v.file_name,addedBy:v.added_by})),
          notes:(notes||[]).map(n=>({id:n.id,title:n.title,body:n.body,createdBy:n.created_by,createdAt:new Date(n.created_at).getTime(),editedAt:n.edited_at?new Date(n.edited_at).getTime():null})),
          activity:(acts||[]).map(a=>({id:a.id,msg:a.message,type:a.type,by:a.done_by,at:new Date(a.created_at).getTime()})),
          trash:(trash||[]).map(tr=>({...tr.expense_data,deletedAt:new Date(tr.deleted_at).getTime(),deletedBy:tr.deleted_by})),
          createdAt:new Date(t.created_at).getTime(),
        };
      }));
      saveTrips(full); // cache locally
      return full;
    }catch(e){ console.error("loadTripsFromSB error:",e); return []; }
  };
  const go=t=>{ setAt(t); setScr("dash"); };
  const splashDone=async()=>{
    handleAuthCallback();
    const sbU=await sbGetSession().catch(()=>null);
    if(sbU && sbU.id){
      setSbUser(sbU);
      const localUser=loadUser();
      if(localUser?.name){
        setUser(localUser);
        const sbTrips=await loadTripsFromSB(sbU.id).catch(()=>[]);
        setTrips(sbTrips.length?sbTrips:loadTrips());
        setScr("home");
      } else {
        setScr("profile");
      }
    } else {
      const u=loadUser(); if(u?.name){setUser(u);setTrips(loadTrips());setScr("home");}else setScr("signin");
    }
  };
  const signIn=()=>setScr("profile");
  const profile=async(d)=>{
    setUser(d); saveUser(d);
    // Save to Supabase if logged in
    try{
      const sbU=await sbGetSession();
      if(sbU && sbU.id){
        setSbUser(sbU);
        let photoUrl=d.photo;
        // Upload photo to Supabase Storage if base64
        if(d.photo && d.photo.startsWith("data:")){
          const url=await sbUpload("avatars","user_"+sbU.id+".jpg",d.photo);
          if(url) photoUrl=url;
        }
        await sbUpsert("users",{id:sbU.id,name:d.name,gender:d.gender,city:d.city,email:d.email||sbU.email||"",photo_url:photoUrl});
        saveUser({...d,photo:photoUrl});
        setUser({...d,photo:photoUrl});
      }
    }catch(e){ console.error("Profile save error:",e); }
    setScr("home");
  };
  const openTrip=t=>{ const all=loadTrips(); go(all.find(x=>x.id===t.id)||t); };
  const tripCreated=t=>{ setAt(t); setCs(3); };
  const goToTrip=()=>{ setCs(0); go(at); };
  const backHome=()=>{ setAt(null); setTrips(loadTrips()); setScr("home"); };
  const updUser=u=>{ setUser(u); saveUser(u); };

  if(loading) return(
    <div style={{position:"fixed",inset:0,background:"#000",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div style={{width:48,height:48,background:"#FFDD57",borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Montserrat,sans-serif",fontSize:18,fontWeight:900,color:"#000"}}>TS</div>
      <div style={{color:"rgba(255,255,255,0.4)",fontSize:13}}>Loading…</div>
    </div>
  );

  return(
    <ThemeCtx.Provider value={theme}>
      <div style={{background:theme.bg,minHeight:"100vh",transition:"background 0.3s"}}>
        {scr==="splash"&&<Splash onDone={splashDone}/>}
        {scr==="signin"&&<SignIn onDone={signIn}/>}
        {scr==="profile"&&<ProfileSetup onDone={profile}/>}
        {scr==="home"&&user&&cs===0&&<Home user={user} trips={trips} onCreate={()=>setCs(1)} onOpen={openTrip} onUpdateUser={updUser} toggleTheme={toggleTheme} dark={dark}/>}
        {scr==="home"&&user&&cs===1&&<CreateTrip user={user} onDone={tripCreated} onBack={()=>setCs(0)}/>}
        {cs===3&&at&&<TripCreated trip={at} onGo={goToTrip}/>}
        {scr==="dash"&&at&&user&&<Dashboard trip={at} user={user} onBack={backHome} toggleTheme={toggleTheme} dark={dark} sbUser={sbUser} loadTripsFromSB={loadTripsFromSB}/>}
      </div>
    </ThemeCtx.Provider>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
